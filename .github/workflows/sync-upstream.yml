name: Sync upstream source

on:
  push:
    branches: [custom]
    paths:
      - 'app/**'
      - 'core/**'
      - 'custom_keyboard/**'
      - 'tenkey/**'
      - 'qwerty_keyboard/**'
      - 'gojuon_keyboard/**'
      - 'symbol_keyboard/**'
      - 'morse_keyboard/**'
      - 'flexbox/**'
      - 'zenz/**'
      - 'ai-runtime/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.gitmodules'
      - 'tools/**/*.py'
      - 'tools/**/*.cjs'
      - 'tools/**/*.sh'
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      verify_age_only:
        description: Only verify the age key pair (no sync, build or publication)
        type: boolean
        default: false
      force_build:
        description: Build even when upstream has not changed
        type: boolean
        default: false
      source_sha:
        description: Optional full commit SHA on custom (only for force_build without a merge)
        type: string
        required: false

permissions: {}
concurrency:
  group: sync-upstream-custom
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'kiwi-93/JapaneseKeyboard' && github.ref == 'refs/heads/custom' && !(github.event_name == 'workflow_dispatch' && inputs.verify_age_only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      actions: write
    outputs:
      status: ${{ steps.select.outputs.status || steps.sync.outputs.status }}
      merged_sha: ${{ steps.sync.outputs.merged_sha || github.sha }}
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}
      build_sha: ${{ steps.select.outputs.build_sha }}
      version_code: ${{ steps.select.outputs.version_code }}
    steps:
      - name: Check out the custom branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'custom' }}
          persist-credentials: ${{ github.event_name != 'push' }}
          fetch-depth: 0
          filter: blob:none
          submodules: false
      - name: Keep a copy of the current sync tool
        if: github.event_name != 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/sumire-sync"
          cp tools/fork-sync/sync_upstream.py "$RUNNER_TEMP/sumire-sync/"
      - name: Merge source updates and notify
        if: github.event_name != 'push'
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: python3 "$RUNNER_TEMP/sumire-sync/sync_upstream.py"
      - name: Select the exact source and monotonic version
        id: select
        env:
          STATUS: ${{ github.event_name == 'push' && 'pushed' || steps.sync.outputs.status }}
          MERGED_SHA: ${{ steps.sync.outputs.merged_sha || github.sha }}
          FORCE: ${{ inputs.force_build }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$MERGED_SHA" =~ ^[a-f0-9]{40}$ ]]
          selected="$MERGED_SHA"
          if [[ "$STATUS" == unchanged && "$FORCE" == true && -n "$REQUESTED_SHA" ]]; then
            [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]]
            git cat-file -e "$REQUESTED_SHA^{commit}"
            git merge-base --is-ancestor "$REQUESTED_SHA" "$MERGED_SHA"
            selected="$REQUESTED_SHA"
          fi
          [[ "$RUN_NUMBER" =~ ^[0-9]+$ && "$RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          (( RUN_ATTEMPT >= 1 && RUN_ATTEMPT <= 249 ))
          base=$((1000000 + RUN_NUMBER * 1000 + RUN_ATTEMPT * 4))
          (( base <= 2099999998 ))
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "build_sha=$selected" >> "$GITHUB_OUTPUT"
          echo "version_code=$((base + 1))" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    if: needs.sync.result == 'success' && (needs.sync.outputs.status == 'pushed' || needs.sync.outputs.status == 'merged' || (github.event_name == 'workflow_dispatch' && inputs.force_build && needs.sync.outputs.status == 'unchanged'))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.sync.outputs.build_sha }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      - name: Verify the exact checked-out source
        env:
          SOURCE_SHA: ${{ needs.sync.outputs.build_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          submodules="$(git submodule status --recursive)"
          if grep -Eq '^[-+U]' <<< "$submodules"; then
            echo 'A submodule does not match the selected commit.' >&2
            exit 1
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install SDK and NDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Run regressions and verify notices
        run: |
          python3 -m unittest discover -s tools/fork-sync -p 'test*.py'
          node --test tools/private-distribution/*.test.cjs
          python3 tools/classified-dictionaries/prepare.py --check
          ./gradlew :app:testFullStandardDebugUnitTest --no-daemon --max-workers=2
      - name: Build unsigned Full Standard ARM64 APK
        env:
          VERSION_CODE: ${{ needs.sync.outputs.version_code }}
        run: |
          set -euo pipefail
          build_attempt=$(((VERSION_CODE - 1000001 - GITHUB_RUN_NUMBER * 1000) / 4))
          (( build_attempt >= 1 && build_attempt <= 249 && VERSION_CODE == 1000001 + GITHUB_RUN_NUMBER * 1000 + build_attempt * 4 ))
          ./gradlew :app:assembleFullStandardReleaseUnsigned -PsplitApks \
            -PzenzReleaseNativeAbis=arm64-v8a -PsumireVersionCode="$((VERSION_CODE - 1))" \
            -PsumireVersionSuffix="ci.${GITHUB_RUN_NUMBER}.${build_attempt}" --no-daemon --max-workers=2
          mapfile -t apks < <(find app/build/outputs/apk/fullStandard/releaseUnsigned -name '*arm64-v8a*.apk' -type f)
          [[ ${#apks[@]} == 1 ]]
          cp "${apks[0]}" "$RUNNER_TEMP/unsigned.apk"
      - name: Install verified age
        run: |
          curl --fail --location --silent --show-error -o "$RUNNER_TEMP/age.tar.gz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  '"$RUNNER_TEMP/age.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP" age/age
      - name: Encrypt the unsigned APK
        env:
          RECIPIENT: ${{ vars.SUMIRE_AGE_RECIPIENT || secrets.SUMIRE_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          [[ "$RECIPIENT" =~ ^age1[0-9a-z]+$ ]]
          "$RUNNER_TEMP/age/age" -r "$RECIPIENT" -o "$RUNNER_TEMP/unsigned.apk.age" "$RUNNER_TEMP/unsigned.apk"
          rm "$RUNNER_TEMP/unsigned.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: encrypted-unsigned-apk-${{ github.run_id }}
          path: ${{ runner.temp }}/unsigned.apk.age
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  publish:
    needs: [sync, build]
    if: always() && github.repository == 'kiwi-93/JapaneseKeyboard' && github.ref == 'refs/heads/custom' && ((github.event_name == 'workflow_dispatch' && inputs.verify_age_only) || (needs.sync.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'failure')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    concurrency:
      group: private-r2-upload
      cancel-in-progress: false
    steps:
      - name: Check out only the reviewed publisher tools
        if: needs.build.result == 'success' && vars.SUMIRE_AUTO_PUBLISH == 'true' && !inputs.verify_age_only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: e139131a13be542038adfcb4c69fde64ee9a2934
          path: publisher
          persist-credentials: false
          submodules: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: needs.build.result == 'success' && vars.SUMIRE_AUTO_PUBLISH == 'true' && !inputs.verify_age_only
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        if: needs.build.result == 'success' && vars.SUMIRE_AUTO_PUBLISH == 'true' && !inputs.verify_age_only
      - run: sdkmanager 'build-tools;36.0.0'
        if: needs.build.result == 'success' && vars.SUMIRE_AUTO_PUBLISH == 'true' && !inputs.verify_age_only
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.build.result == 'success' && vars.SUMIRE_AUTO_PUBLISH == 'true' && !inputs.verify_age_only
        with:
          name: encrypted-unsigned-apk-${{ github.run_id }}
          path: ${{ runner.temp }}/encrypted
      - name: Install verified age
        if: (needs.build.result == 'success' && vars.SUMIRE_AUTO_PUBLISH == 'true' && !inputs.verify_age_only) || (github.event_name == 'workflow_dispatch' && inputs.verify_age_only)
        run: |
          curl --fail --location --silent --show-error -o "$RUNNER_TEMP/age.tar.gz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  '"$RUNNER_TEMP/age.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP" age/age age/age-keygen
      - name: Verify age key pair only
        if: github.event_name == 'workflow_dispatch' && inputs.verify_age_only
        env:
          AGE_IDENTITY: ${{ secrets.SUMIRE_AGE_IDENTITY }}
          AGE_RECIPIENT: ${{ vars.SUMIRE_AGE_RECIPIENT || secrets.SUMIRE_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/age-key-check"' EXIT
          [[ "$AGE_RECIPIENT" =~ ^age1[0-9a-z]+$ ]] || { echo "Invalid or missing age recipient." >&2; exit 1; }
          [[ -n "$AGE_IDENTITY" ]] || { echo "Missing age identity." >&2; exit 1; }
          printf '%s\n' "$AGE_IDENTITY" > "$RUNNER_TEMP/age-key-check"
          unset AGE_IDENTITY
          derived="$("$RUNNER_TEMP/age/age-keygen" -y "$RUNNER_TEMP/age-key-check" 2>/dev/null)" || { echo "Invalid age identity." >&2; exit 1; }
          [[ "$derived" == "$AGE_RECIPIENT" ]] || { echo "The age identity and recipient do not match." >&2; exit 1; }
          echo "Age key pair verified."
          echo "Age key pair verified; no sync, build, signing or R2 upload was performed." >> "$GITHUB_STEP_SUMMARY"
      - name: Decrypt and sign with the existing fork key
        if: needs.build.result == 'success' && vars.SUMIRE_AUTO_PUBLISH == 'true' && !inputs.verify_age_only
        env:
          AGE_IDENTITY: ${{ secrets.SUMIRE_AGE_IDENTITY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/age-key" "$RUNNER_TEMP/fork.jks" "$RUNNER_TEMP/unsigned.apk"' EXIT
          printf '%s\n' "$AGE_IDENTITY" > "$RUNNER_TEMP/age-key"
          "$RUNNER_TEMP/age/age" -d -i "$RUNNER_TEMP/age-key" -o "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/encrypted/unsigned.apk.age"
          unset AGE_IDENTITY
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fork.jks"
          unset KEYSTORE_BASE64
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/fork.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/unsigned.apk"
      - name: Validate APK identity and prepare the existing bundle format
        if: needs.build.result == 'success' && vars.SUMIRE_AUTO_PUBLISH == 'true' && !inputs.verify_age_only
        env:
          SOURCE_SHA: ${{ needs.sync.outputs.build_sha }}
          EXPECTED_VERSION_CODE: ${{ needs.sync.outputs.version_code }}
        run: |
          python3 -c 'import os,zipfile; z=zipfile.ZipFile(os.environ["RUNNER_TEMP"]+"/signed.apk"); libs={n for n in z.namelist() if n.startswith("lib/") and n.endswith(".so")}; assert {n.split("/")[1] for n in libs}=={"arm64-v8a"} and {"lib/arm64-v8a/libzenz.so", "lib/arm64-v8a/liblitertlm_jni.so"} <= libs'
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c 4 "$RUNNER_TEMP/signed.apk"
          python3 publisher/tools/private-distribution/prepare_bundle.py --apk "$RUNNER_TEMP/signed.apk" --build-tools "$ANDROID_HOME/build-tools/36.0.0" --java "$(command -v java)" --commit "$SOURCE_SHA" --output "$RUNNER_TEMP/bundle"
          python3 -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/bundle/build.json")); code=int(os.environ["EXPECTED_VERSION_CODE"]); run=int(os.environ["GITHUB_RUN_NUMBER"]); attempt=(code-1000001-run*1000)//4; assert 1<=attempt<=249 and code==1000001+run*1000+attempt*4 and r["version_code"]==code and "-fork" in r["version_name"] and r["version_name"].endswith(f"-ci.{run}.{attempt}")'
      - name: Install the fixed S3 client
        if: needs.build.result == 'success' && vars.SUMIRE_AUTO_PUBLISH == 'true' && !inputs.verify_age_only
        run: npm ci --prefix publisher/tools/private-distribution --ignore-scripts --no-audit --no-fund
      - name: Verify and publish privately
        if: needs.build.result == 'success' && vars.SUMIRE_AUTO_PUBLISH == 'true' && !inputs.verify_age_only
        id: publish
        env:
          BUNDLE_DIR: ${{ runner.temp }}/bundle
          SOURCE_SHA: ${{ needs.sync.outputs.build_sha }}
          UPSTREAM_SHA: ${{ needs.sync.outputs.upstream_sha }}
          EXPECTED_VERSION_CODE: ${{ needs.sync.outputs.version_code }}
          GITHUB_TOKEN: ${{ github.token }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: node publisher/tools/private-distribution/auto_publish.cjs
      - name: Notify publication result
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.verify_age_only)
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.build.result == 'failure' && 'build failed' || (vars.SUMIRE_AUTO_PUBLISH != 'true' && 'built; publication disabled' || job.status) }}
          APK_URL: ${{ steps.publish.outcome == 'success' && steps.publish.outputs.apk_url || '' }}
          SOURCE_SHA: ${{ needs.sync.outputs.build_sha }}
          VERSION_CODE: ${{ needs.sync.outputs.version_code }}
        run: |
          printf '### APK ビルド・配布: %s\n\n@kiwi-93\n\n対象: `%s`\n\nversionCode: `%s`\n\n%s\n\n実行ログ: %s\n' "$RESULT" "$SOURCE_SHA" "$VERSION_CODE" "$APK_URL" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/comment.txt"
          gh api "repos/$GITHUB_REPOSITORY/issues/1/comments" -F body=@"$RUNNER_TEMP/comment.txt"
