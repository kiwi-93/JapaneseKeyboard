name: Upload existing APK to private R2
run-name: R2 upload ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Generated by upload_existing.cjs
        required: true
        type: string
      recipient_key:
        description: Ephemeral public encryption key generated by the upload client
        required: true
        type: string
      manifest:
        description: Checksums and metadata for the existing signed APK
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: private-r2-upload
  cancel-in-progress: false

jobs:
  upload:
    if: github.repository == 'kiwi-93/JapaneseKeyboard' && github.ref == 'refs/heads/custom'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPLOAD_REQUEST_ID: ${{ inputs.request_id }}
      UPLOAD_RECIPIENT_KEY: ${{ inputs.recipient_key }}
      UPLOAD_MANIFEST: ${{ inputs.manifest }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false

      - name: Install the S3 upload tools only
        run: npm install --prefix "$RUNNER_TEMP/r2-tools" --no-save --ignore-scripts @aws-sdk/client-s3@3.1161.0 @aws-sdk/s3-request-presigner@3.1161.0

      - name: Prepare an encrypted temporary upload grant
        env:
          NODE_PATH: ${{ runner.temp }}/r2-tools/node_modules
        run: node tools/private-distribution/r2_runner.cjs grant

      - name: Publish the encrypted grant
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sealed-r2-upload-${{ inputs.request_id }}
          path: ${{ runner.temp }}/sealed-r2-upload/envelope.json
          retention-days: 1
          if-no-files-found: error

      - name: Verify the uploaded files and update the private latest pointer
        env:
          NODE_PATH: ${{ runner.temp }}/r2-tools/node_modules
        run: node tools/private-distribution/r2_runner.cjs verify
